spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=40MB
management.health.mail.enabled=false
management.endpoints.web.exposure.include=health
server.forward-headers-strategy=framework
app.gateway-request-logging=true
app.frontend.base-url=http://127.0.0.1:18081
app.cors.allowed-origins=http://127.0.0.1:18081
app.base-url=http://127.0.0.1:18081
payment.policy.currency=eur
payment.base-url=http://127.0.0.1:18084
spring.main.banner-mode=off
