name: autostrada
services:
  mysql:
    image: mysql:8.4.8@sha256:2952e3be7807f06fc18de50b3ea1a632d5c70d63482ff7d7376fe3aa8999babf
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-autostrada}
      MYSQL_USER: ${MYSQL_USER:-autostrada}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set a private database password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set a distinct private root password}
      TZ: UTC
    command: ["--default-time-zone=+00:00"]
    volumes:
      - mysql-data:/var/lib/mysql
    networks: [database]
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=TCP -h 127.0.0.1 -u\"$$MYSQL_USER\" \"$$MYSQL_DATABASE\" --execute='SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      start_period: 40s
      retries: 24
    stop_grace_period: 30s

  backend:
    build:
      context: ./back
      target: production
    environment:
      SPRING_PROFILES_ACTIVE: mysql,gateway,container
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-autostrada}?serverTimezone=UTC&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&allowPublicKeyRetrieval=true&useSSL=false
      DB_USERNAME: ${MYSQL_USER:-autostrada}
      DB_PASSWORD: ${MYSQL_PASSWORD:?Set a private database password}
      APP_DEMO_DATA_ACK: ${APP_DEMO_DATA_ACK:?Read docs/docker-compose.md and acknowledge existing demo migrations}
      APP_BASE_URL: ${PUBLIC_URL:-http://localhost:8081}
      APP_FRONTEND_BASE_URL: ${PUBLIC_URL:-http://localhost:8081}
      APP_CORS_ALLOWED_ORIGINS: ${PUBLIC_URL:-http://localhost:8081}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      STRIPE_ENABLED: ${STRIPE_ENABLED:-false}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      APP_MAIL_MODE: ${APP_MAIL_MODE:-log}
      APP_MAIL_FROM: ${APP_MAIL_FROM:-no-reply@autostradaauctions.local}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-true}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      TZ: UTC
      JAVA_TOOL_OPTIONS: -Duser.timezone=UTC
    depends_on:
      mysql: { condition: service_healthy }
    networks: [edge, database, outbound]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    stop_grace_period: 30s

  frontend:
    build: ./front
    networks: [edge]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  gateway:
    build: ./gateway
    environment:
      GATEWAY_PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8081}
      GATEWAY_BACKEND_URL: http://backend:8080
      GATEWAY_FRONTEND_URL: http://frontend:8080
      GATEWAY_ALLOWED_ORIGINS: ${PUBLIC_URL:-http://localhost:8081}
    ports:
      - "${GATEWAY_BIND_ADDRESS:-127.0.0.1}:${GATEWAY_PORT:-8081}:8081"
    depends_on:
      backend: { condition: service_healthy }
      frontend: { condition: service_healthy }
    networks: [edge, outbound]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 18

volumes:
  mysql-data:
networks:
  edge: { internal: true }
  database: { internal: true }
  outbound: {}
