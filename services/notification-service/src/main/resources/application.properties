spring.application.name=notification-service
server.address=127.0.0.1
server.port=${NOTIFICATION_PORT:8083}
spring.datasource.url=${NOTIFICATION_DB_URL}
spring.datasource.username=${NOTIFICATION_DB_USERNAME}
spring.datasource.password=${NOTIFICATION_DB_PASSWORD}
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.validation-timeout=2000
spring.flyway.enabled=true
identity.verification-jwks=${IDENTITY_VERIFICATION_JWKS}
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db
management.health.mail.enabled=false
server.error.include-message=never
notification.broker.host=${RABBITMQ_HOST:localhost}
notification.broker.port=${RABBITMQ_PORT:5672}
notification.broker.username=${RABBITMQ_USERNAME:notification}
notification.broker.password=${RABBITMQ_PASSWORD}
notification.broker.vhost=${RABBITMQ_VHOST:autostrada}
notification.broker.enabled=${NOTIFICATION_BROKER_ENABLED:true}
notification.delivery-key=${NOTIFICATION_DELIVERY_KEY}
notification.public-url=${PUBLIC_URL:http://localhost:8081}
app.mail.mode=${APP_MAIL_MODE:log}
app.mail.from=${APP_MAIL_FROM:no-reply@autostradaauctions.local}
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=3000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=3000

# Telemetry is opt-in; the custom exporter sanitizes spans before transport.
management.tracing.enabled=false
management.otlp.tracing.export.enabled=false
