spring.application.name=autostrada-gateway
server.address=${GATEWAY_BIND_ADDRESS:127.0.0.1}
server.port=${GATEWAY_PORT:8081}
server.forward-headers-strategy=none
gateway.backend-url=${GATEWAY_BACKEND_URL:http://127.0.0.1:8080}
gateway.frontend-url=${GATEWAY_FRONTEND_URL:http://127.0.0.1:5173}
gateway.public-url=${GATEWAY_PUBLIC_URL:http://localhost:8081}
gateway.allowed-origins=${GATEWAY_ALLOWED_ORIGINS:http://localhost:5173}
spring.cloud.gateway.server.webflux.httpclient.connect-timeout=2000
spring.cloud.gateway.server.webflux.httpclient.response-timeout=30s
spring.cloud.gateway.server.webflux.httpclient.pool.type=fixed
spring.cloud.gateway.server.webflux.httpclient.pool.max-connections=100
spring.cloud.gateway.server.webflux.httpclient.pool.acquire-timeout=2000
spring.cloud.gateway.server.webflux.httpclient.pool.max-idle-time=30s
# The edge constructs its own forwarding headers; never append untrusted ones.
spring.cloud.gateway.server.webflux.forwarded.enabled=false
spring.cloud.gateway.server.webflux.x-forwarded.enabled=false
spring.cloud.gateway.server.webflux.httpclient.wiretap=false
spring.cloud.gateway.server.webflux.httpserver.wiretap=false
spring.cloud.gateway.server.webflux.metrics.enabled=true
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,upstream
logging.level.reactor.netty=OFF
