name: autostrada
services:
  mysql:
    image: mysql:8.4.8@sha256:2952e3be7807f06fc18de50b3ea1a632d5c70d63482ff7d7376fe3aa8999babf
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-autostrada}
      MYSQL_USER: ${MYSQL_USER:-autostrada}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set a private database password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set a distinct private root password}
      DB_RUNTIME_USERNAME: ${DB_RUNTIME_USERNAME:?Set the backend runtime database username}
      DB_RUNTIME_PASSWORD: ${DB_RUNTIME_PASSWORD:?Set the backend runtime database password}
      DB_MIGRATION_USERNAME: ${DB_MIGRATION_USERNAME:?Set the backend migration database username}
      DB_MIGRATION_PASSWORD: ${DB_MIGRATION_PASSWORD:?Set the backend migration database password}
      IDENTITY_DB_NAME: ${IDENTITY_DB_NAME:-autostrada_identity}
      IDENTITY_DB_USERNAME: ${IDENTITY_DB_USERNAME:?Set the identity database username}
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:?Set the identity database password}
      NOTIFICATION_DB_NAME: ${NOTIFICATION_DB_NAME:-autostrada_notification}
      NOTIFICATION_DB_USERNAME: ${NOTIFICATION_DB_USERNAME:?Set the notification database username}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?Set the notification database password}
      TZ: UTC
    command: ["--default-time-zone=+00:00"]
    volumes:
      - mysql-data:/var/lib/mysql
      - ./back/scripts/mysql-init-users.sh:/docker-entrypoint-initdb.d/20-autostrada-users.sh:ro
    networks: [database]
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=TCP -h 127.0.0.1 -u\"$$MYSQL_USER\" \"$$MYSQL_DATABASE\" --execute='SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      start_period: 40s
      retries: 24
    stop_grace_period: 30s

  backend:
    build:
      context: ./back
      target: production
    environment:
      SPRING_PROFILES_ACTIVE: mysql,gateway,container
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-autostrada}?serverTimezone=UTC&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&allowPublicKeyRetrieval=true&useSSL=false
      DB_USERNAME: ${DB_RUNTIME_USERNAME:?Set the backend runtime database username}
      DB_PASSWORD: ${DB_RUNTIME_PASSWORD:?Set the backend runtime database password}
      DB_RUNTIME_USERNAME: ${DB_RUNTIME_USERNAME:?Set the backend runtime database username}
      SPRING_FLYWAY_USER: ${DB_MIGRATION_USERNAME:?Set the backend migration database username}
      SPRING_FLYWAY_PASSWORD: ${DB_MIGRATION_PASSWORD:?Set the backend migration database password}
      APP_DEMO_DATA_ACK: ${APP_DEMO_DATA_ACK:?Read docs/docker-compose.md and acknowledge existing demo migrations}
      APP_BASE_URL: ${PUBLIC_URL:-http://localhost:8081}
      APP_FRONTEND_BASE_URL: ${PUBLIC_URL:-http://localhost:8081}
      APP_CORS_ALLOWED_ORIGINS: ${PUBLIC_URL:-http://localhost:8081}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      IDENTITY_URL: http://identity:8080
      NOTIFICATION_URL: http://notification:8080
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: backend
      RABBITMQ_PASSWORD: ${RABBITMQ_BACKEND_PASSWORD:?Set a distinct backend broker password}
      IDENTITY_VERIFICATION_JWKS: ${IDENTITY_VERIFICATION_JWKS:?Set identity public verification JWKS}
      IDENTITY_BACKEND_SECRET: ${IDENTITY_BACKEND_SECRET:?Set the backend identity service secret}
      STRIPE_ENABLED: ${STRIPE_ENABLED:-false}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      APP_MAIL_MODE: ${APP_MAIL_MODE:-log}
      APP_MAIL_FROM: ${APP_MAIL_FROM:-no-reply@autostradaauctions.local}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-true}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      TZ: UTC
      JAVA_TOOL_OPTIONS: -Duser.timezone=UTC
    depends_on:
      mysql: { condition: service_healthy }
      identity: { condition: service_healthy }
    networks: [edge, database, outbound]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    stop_grace_period: 30s

  identity:
    build:
      context: ./services/identity-service
      target: production
    environment:
      SPRING_PROFILES_ACTIVE: mysql,container
      IDENTITY_DB_URL: ${IDENTITY_DB_URL:-jdbc:mysql://mysql:3306/${IDENTITY_DB_NAME:-autostrada_identity}?serverTimezone=UTC&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&allowPublicKeyRetrieval=true&useSSL=false}
      IDENTITY_DB_USERNAME: ${IDENTITY_DB_USERNAME:?Set the identity database username}
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:?Set the identity database password}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8081}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      IDENTITY_SIGNING_JWK: ${IDENTITY_SIGNING_JWK:?Set the identity private signing JWK}
      NOTIFICATION_DELIVERY_KEY: ${NOTIFICATION_DELIVERY_KEY:?Set a base64 256-bit delivery encryption key}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: identity
      RABBITMQ_PASSWORD: ${RABBITMQ_IDENTITY_PASSWORD:?Set a distinct identity broker password}
      IDENTITY_GATEWAY_SECRET: ${IDENTITY_GATEWAY_SECRET:?Set the gateway identity exchange secret}
      IDENTITY_BACKEND_SECRET: ${IDENTITY_BACKEND_SECRET:?Set the backend identity service secret}
      TZ: UTC
      JAVA_TOOL_OPTIONS: -Duser.timezone=UTC
    depends_on:
      mysql: { condition: service_healthy }
    networks: [edge, database, outbound]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    stop_grace_period: 30s

  rabbitmq:
    build: ./infra/rabbitmq
    hostname: rabbitmq
    environment:
      RABBITMQ_BACKEND_PASSWORD: ${RABBITMQ_BACKEND_PASSWORD:?Set a distinct backend broker password}
      RABBITMQ_IDENTITY_PASSWORD: ${RABBITMQ_IDENTITY_PASSWORD:?Set a distinct identity broker password}
      RABBITMQ_NOTIFICATION_PASSWORD: ${RABBITMQ_NOTIFICATION_PASSWORD:?Set a distinct notification broker password}
      RABBITMQ_OPERATOR_PASSWORD: ${RABBITMQ_OPERATOR_PASSWORD:?Set a distinct broker operator password}
    volumes: [rabbitmq-data:/var/lib/rabbitmq]
    networks: [edge]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 24
    stop_grace_period: 30s

  notification:
    build: ./services/notification-service
    environment:
      NOTIFICATION_DB_URL: jdbc:mysql://mysql:3306/${NOTIFICATION_DB_NAME:-autostrada_notification}?serverTimezone=UTC&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&allowPublicKeyRetrieval=true&useSSL=false
      NOTIFICATION_DB_USERNAME: ${NOTIFICATION_DB_USERNAME:?Set the notification database username}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?Set the notification database password}
      IDENTITY_VERIFICATION_JWKS: ${IDENTITY_VERIFICATION_JWKS:?Set public verification JWKS}
      NOTIFICATION_DELIVERY_KEY: ${NOTIFICATION_DELIVERY_KEY:?Set the delivery encryption key}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: notification
      RABBITMQ_PASSWORD: ${RABBITMQ_NOTIFICATION_PASSWORD:?Set a distinct notification broker password}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8081}
      APP_MAIL_MODE: ${APP_MAIL_MODE:-log}
      APP_MAIL_FROM: ${APP_MAIL_FROM:-no-reply@autostradaauctions.local}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-true}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
    depends_on:
      mysql: { condition: service_healthy }
    networks: [edge, database, outbound]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  frontend:
    build: ./front
    networks: [edge]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  gateway:
    build: ./gateway
    environment:
      GATEWAY_PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8081}
      GATEWAY_BACKEND_URL: http://backend:8080
      GATEWAY_IDENTITY_URL: http://identity:8080
      GATEWAY_IDENTITY_SECRET: ${IDENTITY_GATEWAY_SECRET:?Set the gateway identity exchange secret}
      GATEWAY_NOTIFICATION_URL: http://notification:8080
      GATEWAY_FRONTEND_URL: http://frontend:8080
      GATEWAY_ALLOWED_ORIGINS: ${PUBLIC_URL:-http://localhost:8081}
    ports:
      - "${GATEWAY_BIND_ADDRESS:-127.0.0.1}:${GATEWAY_PORT:-8081}:8081"
    depends_on:
      backend: { condition: service_healthy }
      identity: { condition: service_healthy }
      frontend: { condition: service_healthy }
    networks: [edge, outbound]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 18

volumes:
  mysql-data:
  rabbitmq-data:
networks:
  edge: { internal: true }
  database: { internal: true }
  outbound: {}
