# Opt-in only when backend ingress is restricted to the gateway/private loopback.
# Gateway strips external forwarding/identity headers and reconstructs the public origin.
server.address=127.0.0.1
server.forward-headers-strategy=framework
app.gateway-request-logging=true
app.frontend.base-url=${APP_FRONTEND_BASE_URL:http://localhost:8081}
app.base-url=${APP_BASE_URL:http://localhost:8081}
payments.stripe.base-url=${APP_BASE_URL:http://localhost:8081}
