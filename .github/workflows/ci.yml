name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        shell: bash
        working-directory: back

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: |
            back/pom.xml
            back/.mvn/wrapper/maven-wrapper.properties

      - name: Test and package backend
        run: bash ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Upload backend test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: back/target/surefire-reports/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload backend JAR
        uses: actions/upload-artifact@v7
        with:
          name: backend-jar
          path: back/target/*.jar
          if-no-files-found: error
          retention-days: 7

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 25

    defaults:
      run:
        shell: bash
        working-directory: front

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Test frontend
        run: npm test -- --reporter=default --reporter=junit --outputFile=test-results/vitest.xml

      - name: Upload frontend test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: frontend-test-reports
          path: front/test-results/
          if-no-files-found: warn
          retention-days: 7

      - name: Build frontend
        run: npm run build

      - name: Upload frontend build
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: front/dist/
          if-no-files-found: error
          retention-days: 7

      # Keep E2E inside the existing required Frontend check so it gates master
      # immediately, without silently relying on a new optional check name.
      - name: Set up Java 17 for browser E2E
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: back/pom.xml

      - name: Install Playwright Chromium and OS dependencies
        run: npx playwright install --with-deps chromium

      - name: Browser E2E with isolated startup and teardown
        run: npm run test:e2e

      - name: Verify E2E servers stopped
        if: ${{ always() }}
        run: node e2e/assert-stopped.mjs

      - name: Upload browser failure evidence and server logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: browser-e2e-results
          path: |
            front/playwright-report/
            front/test-results/playwright/
            front/e2e-results/
          if-no-files-found: warn
          retention-days: 7
