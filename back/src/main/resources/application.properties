spring.servlet.multipart.enabled=true
spring.servlet.multipart.file-size-threshold=2KB
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=40MB

# Zero-configuration local development database. Use the mysql profile for deployment.
spring.datasource.url=jdbc:h2:file:./data/autostrada-auctions;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

server.error.include-message=never
management.endpoints.web.exposure.include=health,info
management.health.mail.enabled=false

# React development server origins allowed to call backend API endpoints.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.frontend.base-url=${APP_FRONTEND_BASE_URL:http://localhost:5173}

# Business currency remains local until commerce/marketplace extraction.
payment.policy.currency=${PAYMENT_CURRENCY:eur}
payment.base-url=${PAYMENT_URL:http://127.0.0.1:8084}
payment.results.enabled=${PAYMENT_RESULTS_ENABLED:true}
payment.results.poll-ms=${PAYMENT_RESULTS_POLL_MS:1000}

auction.notifications.ending-soon-window=${AUCTION_ENDING_SOON_WINDOW:PT24H}
auction.notifications.scan-interval-ms=${AUCTION_NOTIFICATION_SCAN_MS:300000}
auction.notifications.scheduling-enabled=${AUCTION_NOTIFICATION_SCHEDULING:true}

# Only identity assertions are accepted; runtime never reads archived identity tables.
identity.base-url=${IDENTITY_URL:http://127.0.0.1:8082}
identity.verification-jwks=${IDENTITY_VERIFICATION_JWKS}
identity.service-secret=${IDENTITY_BACKEND_SECRET}
notification.base-url=${NOTIFICATION_URL:http://127.0.0.1:8083}
notification.broker.host=${RABBITMQ_HOST:localhost}
notification.broker.port=${RABBITMQ_PORT:5672}
notification.broker.username=${RABBITMQ_USERNAME:backend}
notification.broker.password=${RABBITMQ_PASSWORD:}
notification.broker.vhost=${RABBITMQ_VHOST:autostrada}
notification.relay.enabled=${NOTIFICATION_RELAY_ENABLED:true}

# Telemetry is opt-in; the custom exporter sanitizes spans before transport.
management.tracing.enabled=false
management.otlp.tracing.export.enabled=false
