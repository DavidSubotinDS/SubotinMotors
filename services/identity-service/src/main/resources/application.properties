spring.application.name=identity-service
server.address=127.0.0.1
server.port=${IDENTITY_PORT:8082}
spring.datasource.url=${IDENTITY_DB_URL:jdbc:h2:mem:identity;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1}
spring.datasource.username=${IDENTITY_DB_USERNAME:sa}
spring.datasource.password=${IDENTITY_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.validation-timeout=2000
server.servlet.session.cookie.name=AUTOSTRADA_SESSION
server.servlet.session.cookie.path=/
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.timeout=30m
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=40MB
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db
management.health.mail.enabled=false
server.error.include-message=never
app.cors.allowed-origins=${PUBLIC_URL:http://localhost:8081}
app.frontend.base-url=${PUBLIC_URL:http://localhost:8081}
app.base-url=${PUBLIC_URL:http://localhost:8081}
app.gateway-request-logging=true
identity.signing-jwk=${IDENTITY_SIGNING_JWK}
identity.gateway-secret=${IDENTITY_GATEWAY_SECRET}
identity.backend-secret=${IDENTITY_BACKEND_SECRET}
identity.issuer=autostrada-identity
password-reset.expiry=${PASSWORD_RESET_EXPIRY:PT30M}
notification.delivery-key=${NOTIFICATION_DELIVERY_KEY}
notification.broker.host=${RABBITMQ_HOST:localhost}
notification.broker.port=${RABBITMQ_PORT:5672}
notification.broker.username=${RABBITMQ_USERNAME:identity}
notification.broker.password=${RABBITMQ_PASSWORD:}
notification.broker.vhost=${RABBITMQ_VHOST:autostrada}
notification.relay.enabled=${NOTIFICATION_RELAY_ENABLED:true}
