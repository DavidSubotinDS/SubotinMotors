# Optional private telemetry listener. Never publish this port through Compose.
management.server.address=${OBSERVABILITY_BIND_ADDRESS:127.0.0.1}
management.server.port=${OBSERVABILITY_PORT:9080}
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never
management.endpoint.health.probes.add-additional-paths=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.minimum-expected-value.http.server.requests=1ms
management.metrics.distribution.maximum-expected-value.http.server.requests=30s
management.metrics.tags.service=gateway
gateway.probe-path=/readyz
management.endpoint.health.probes.enabled=true
management.tracing.enabled=true
management.tracing.sampling.probability=1.0
management.tracing.propagation.type=w3c
spring.reactor.context-propagation=auto
