spring.application.name=payment-service
server.address=${PAYMENT_BIND_ADDRESS:127.0.0.1}
server.port=${PAYMENT_PORT:8084}
spring.datasource.url=${PAYMENT_DB_URL}
spring.datasource.username=${PAYMENT_DB_USERNAME}
spring.datasource.password=${PAYMENT_DB_PASSWORD}
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.validation-timeout=2000
spring.flyway.enabled=true
identity.verification-jwks=${IDENTITY_VERIFICATION_JWKS}
payment.public-url=${PUBLIC_URL:http://localhost:8081}
payment.provider.enabled=${STRIPE_ENABLED:false}
payment.provider.secret-key=${STRIPE_SECRET_KEY:}
payment.provider.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
payment.accepted-currencies=${PAYMENT_ACCEPTED_CURRENCIES:eur}
payment.reconciliation.poll-ms=${PAYMENT_RECONCILIATION_POLL_MS:5000}
payment.webhook.poll-ms=${PAYMENT_WEBHOOK_POLL_MS:2000}
payment.outbox.poll-ms=${PAYMENT_OUTBOX_POLL_MS:1000}
payment.broker.enabled=${PAYMENT_BROKER_ENABLED:true}
payment.broker.host=${RABBITMQ_HOST:localhost}
payment.broker.port=${RABBITMQ_PORT:5672}
payment.broker.username=${RABBITMQ_USERNAME:payment}
payment.broker.password=${RABBITMQ_PASSWORD:}
payment.broker.vhost=${RABBITMQ_VHOST:autostrada}
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db
server.error.include-message=never
