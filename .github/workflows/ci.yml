name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 40

    defaults:
      run:
        shell: bash
        working-directory: back

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: |
            back/pom.xml
            back/.mvn/wrapper/maven-wrapper.properties
            gateway/pom.xml
            gateway/.mvn/wrapper/maven-wrapper.properties

      - name: Test and package backend
        run: bash ./mvnw --batch-mode --no-transfer-progress clean verify

      # Gateway failures block the existing required Backend check.
      - name: Independently test and package gateway
        working-directory: gateway
        run: bash ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Build gateway container
        working-directory: gateway
        run: docker build --tag autostrada-gateway:ci .

      - name: Smoke gateway container without upstreams
        working-directory: gateway
        run: |
          docker run --detach --name gateway-ci --publish 127.0.0.1:18081:8081 autostrada-gateway:ci
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18081/actuator/health/liveness; then break; fi
            sleep 2
          done
          curl --fail http://127.0.0.1:18081/actuator/health/liveness
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18081/actuator/health/readiness)" = 503
          test "$(docker exec gateway-ci id -u)" != 0

      - name: Gateway container logs and cleanup
        if: ${{ always() }}
        working-directory: gateway
        run: |
          mkdir -p target
          if docker inspect gateway-ci > /dev/null 2>&1; then
            docker logs gateway-ci > target/container.log 2>&1
            docker rm --force gateway-ci
          fi

      - name: Upload gateway test and container evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: gateway-test-reports
          path: |
            gateway/target/surefire-reports/
            gateway/target/container.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload backend test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: back/target/surefire-reports/
          if-no-files-found: warn
          retention-days: 7

      - name: Set up Node.js for Compose orchestration
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Production containers and MySQL integration
        working-directory: .
        run: node front/e2e/compose.mjs --integration-only

      - name: Clean up owned Compose resources after any outcome
        if: ${{ always() }}
        working-directory: .
        run: node front/e2e/compose-cleanup.mjs

      - name: Upload Compose and MySQL evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: backend-compose-mysql
          path: |
            compose-results/**/evidence.json
            compose-results/**/failure.txt
            compose-results/**/*.log
            compose-results/**/migrations.tsv
            compose-results/**/project.json
          if-no-files-found: warn
          retention-days: 7

      - name: Upload backend JAR
        uses: actions/upload-artifact@v7
        with:
          name: backend-jar
          path: back/target/*.jar
          if-no-files-found: error
          retention-days: 7

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 45

    defaults:
      run:
        shell: bash
        working-directory: front

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Test frontend
        run: npm test -- --reporter=default --reporter=junit --outputFile=test-results/vitest.xml

      - name: Upload frontend test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: frontend-test-reports
          path: front/test-results/
          if-no-files-found: warn
          retention-days: 7

      - name: Build frontend
        run: npm run build

      - name: Upload frontend build
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: front/dist/
          if-no-files-found: error
          retention-days: 7

      # Keep E2E inside the existing required Frontend check so it gates master
      # immediately, without silently relying on a new optional check name.
      - name: Set up Java 17 for browser E2E
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: |
            back/pom.xml
            gateway/pom.xml

      - name: Install Playwright Chromium and OS dependencies
        run: npx playwright install --with-deps chromium

      - name: Browser E2E with isolated startup and teardown
        run: npm run test:e2e

      - name: Browser E2E through Compose with isolated MySQL
        run: npm run test:compose

      - name: Clean up owned Compose resources after any outcome
        if: ${{ always() }}
        run: node e2e/compose-cleanup.mjs

      - name: Verify E2E servers stopped
        if: ${{ always() }}
        run: node e2e/assert-stopped.mjs

      - name: Upload browser failure evidence and server logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: browser-e2e-results
          path: |
            front/playwright-report/
            front/test-results/playwright/
            front/e2e-results/
            compose-results/**/evidence.json
            compose-results/**/failure.txt
            compose-results/**/*.log
            compose-results/**/migrations.tsv
            compose-results/**/project.json
            compose-results/**/browser/
          if-no-files-found: warn
          retention-days: 7
