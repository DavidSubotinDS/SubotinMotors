name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"

jobs:
  observability:
    name: Observability configuration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Monitoring rules, provisioning and isolated startup
        run: node infra/observability/smoke.mjs
      - name: Retain monitoring diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: observability-${{ github.sha }}
          path: target/observability
          retention-days: 7

  deployment-scripts:
    name: Deployment environment scripts
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Windows PowerShell 5.1 compatibility
        shell: powershell
        run: ./deploy/local/Test-EnvironmentScripts.ps1
      - name: PowerShell 7 compatibility
        shell: pwsh
        run: ./deploy/local/Test-EnvironmentScripts.ps1

  backend:
    name: Backend
    needs: [deployment-scripts, observability]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 40

    defaults:
      run:
        shell: bash
        working-directory: back

    steps:
      - name: Require deployment script and observability checks
        if: ${{ needs.deployment-scripts.result != 'success' || needs.observability.result != 'success' }}
        working-directory: .
        run: exit 1

      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: |
            back/pom.xml
            back/.mvn/wrapper/maven-wrapper.properties
            gateway/pom.xml
            gateway/.mvn/wrapper/maven-wrapper.properties
            services/notification-service/pom.xml
            services/identity-service/pom.xml
            services/identity-service/.mvn/wrapper/maven-wrapper.properties
            services/payment-service/pom.xml
            services/payment-service/.mvn/wrapper/maven-wrapper.properties

      - name: Test and package backend
        run: bash ./mvnw --batch-mode --no-transfer-progress -Pstatic-analysis clean verify

      # Identity-service failures block the existing required Backend check.
      - name: Independently test and package identity service
        working-directory: services/identity-service
        run: bash ./mvnw --batch-mode --no-transfer-progress -Pstatic-analysis clean verify

      - name: Independently test and package notification service
        working-directory: services/notification-service
        run: bash ./mvnw --batch-mode --no-transfer-progress -Pstatic-analysis clean verify

      - name: Independently test and package payment service
        working-directory: services/payment-service
        run: bash ./mvnw --batch-mode --no-transfer-progress -Pstatic-analysis clean verify

      - name: Upload payment service test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: payment-service-test-reports
          path: services/payment-service/target/surefire-reports/
          if-no-files-found: error
          retention-days: 7

      - name: Upload notification test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: notification-service-test-reports
          path: services/notification-service/target/surefire-reports/
          if-no-files-found: error
          retention-days: 7

      - name: Upload service JARs
        uses: actions/upload-artifact@v7
        with:
          name: extracted-service-jars
          path: |
            services/identity-service/target/*.jar
            services/notification-service/target/*.jar
            services/payment-service/target/*.jar
          if-no-files-found: error
          retention-days: 7

      - name: Build identity service container
        working-directory: services/identity-service
        run: docker build --tag autostrada-identity-service:ci .

      - name: Build payment service container
        working-directory: services/payment-service
        run: docker build --tag autostrada-payment-service:ci .

      - name: Smoke identity service container without a database
        working-directory: services/identity-service
        run: |
          docker run --detach --name identity-ci --publish 127.0.0.1:18082:8082 \
            -e IDENTITY_SIGNING_JWK='{"kty":"RSA","kid":"ci","n":"invalid","e":"AQAB","d":"invalid"}' \
            -e IDENTITY_GATEWAY_SECRET=ci-gateway-secret-000000000000000000 \
            -e IDENTITY_BACKEND_SECRET=ci-backend-secret-000000000000000000 \
            autostrada-identity-service:ci
          stopped=false
          for attempt in {1..30}; do
            state="$(docker inspect --format '{{.State.Status}}' identity-ci 2>/dev/null || true)"
            if [[ "$state" == "exited" || "$state" == "dead" ]]; then
              stopped=true
              break
            fi
            sleep 2
          done
          if [[ "$stopped" != true ]]; then
            echo "Identity service did not stop within the startup-failure timeout"
            docker logs identity-ci || true
            exit 1
          fi
          exit_code="$(docker inspect --format '{{.State.ExitCode}}' identity-ci)"
          if [[ "$exit_code" == "0" ]]; then
            echo "Identity service unexpectedly started successfully"
            docker logs identity-ci || true
            exit 1
          fi

      - name: Identity service container logs and cleanup
        if: ${{ always() }}
        working-directory: services/identity-service
        run: |
          mkdir -p target
          if docker inspect identity-ci > /dev/null 2>&1; then
            docker logs identity-ci > target/container.log 2>&1
            docker rm --force identity-ci
          fi

      - name: Upload identity service test and container evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: identity-service-test-reports
          path: |
            services/identity-service/target/surefire-reports/
            services/identity-service/target/container.log
          if-no-files-found: warn
          retention-days: 7

      # Gateway failures block the existing required Backend check.
      - name: Independently test and package gateway
        working-directory: gateway
        run: bash ./mvnw --batch-mode --no-transfer-progress -Pstatic-analysis clean verify

      - name: Upload Java static analysis reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: java-static-analysis
          path: |
            back/target/pmd.xml
            gateway/target/pmd.xml
            services/*/target/pmd.xml
          if-no-files-found: error
          retention-days: 14

      - name: Build gateway container
        working-directory: gateway
        run: docker build --tag autostrada-gateway:ci .

      - name: Smoke gateway container without upstreams
        working-directory: gateway
        run: |
          docker run --detach --name gateway-ci --publish 127.0.0.1:18081:8081 autostrada-gateway:ci
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18081/actuator/health/liveness; then break; fi
            sleep 2
          done
          curl --fail http://127.0.0.1:18081/actuator/health/liveness
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18081/actuator/health/readiness)" = 503
          test "$(docker exec gateway-ci id -u)" != 0

      - name: Gateway container logs and cleanup
        if: ${{ always() }}
        working-directory: gateway
        run: |
          mkdir -p target
          if docker inspect gateway-ci > /dev/null 2>&1; then
            docker logs gateway-ci > target/container.log 2>&1
            docker rm --force gateway-ci
          fi

      - name: Upload gateway test and container evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: gateway-test-reports
          path: |
            gateway/target/surefire-reports/
            gateway/target/container.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload backend test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: back/target/surefire-reports/
          if-no-files-found: warn
          retention-days: 7

      - name: Set up Node.js for Compose orchestration
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Production containers and MySQL integration
        working-directory: .
        run: node front/e2e/compose.mjs --integration-only --observability

      - name: Clean up owned Compose resources after any outcome
        if: ${{ always() }}
        working-directory: .
        run: node front/e2e/compose-cleanup.mjs

      - name: Upload Compose and MySQL evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: backend-compose-mysql
          path: |
            compose-results/**/evidence.json
            compose-results/**/failure.txt
            compose-results/**/*.log
            compose-results/**/migrations.tsv
            compose-results/**/project.json
          if-no-files-found: warn
          retention-days: 7

      - name: Upload backend JAR
        uses: actions/upload-artifact@v7
        with:
          name: backend-jar
          path: back/target/*.jar
          if-no-files-found: error
          retention-days: 7

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 45

    defaults:
      run:
        shell: bash
        working-directory: front

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Analyze frontend and browser harness
        run: npm run lint:ci

      - name: Upload ESLint report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: frontend-static-analysis
          path: front/test-results/eslint.json
          if-no-files-found: error
          retention-days: 14

      - name: Test frontend
        run: npm test -- --reporter=default --reporter=junit --outputFile=test-results/vitest.xml

      - name: Upload frontend test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: frontend-test-reports
          path: front/test-results/
          if-no-files-found: warn
          retention-days: 7

      - name: Build frontend
        run: npm run build

      - name: Upload frontend build
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: front/dist/
          if-no-files-found: error
          retention-days: 7

      # Keep E2E inside the existing required Frontend check so it gates master
      # immediately, without silently relying on a new optional check name.
      - name: Set up Java 17 for browser E2E
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: |
            back/pom.xml
            gateway/pom.xml
            services/notification-service/pom.xml
            services/identity-service/pom.xml
            services/payment-service/pom.xml

      - name: Install Playwright Chromium and OS dependencies
        run: npx playwright install --with-deps chromium

      - name: Browser E2E with isolated startup and teardown
        run: npm run test:e2e

      - name: Browser E2E through Compose with isolated MySQL
        run: npm run test:compose -- --observability

      - name: Clean up owned Compose resources after any outcome
        if: ${{ always() }}
        run: node e2e/compose-cleanup.mjs

      - name: Verify E2E servers stopped
        if: ${{ always() }}
        run: node e2e/assert-stopped.mjs

      - name: Upload browser failure evidence and server logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: browser-e2e-results
          path: |
            front/playwright-report/
            front/test-results/playwright/
            front/e2e-results/
            compose-results/**/evidence.json
            compose-results/**/failure.txt
            compose-results/**/*.log
            compose-results/**/migrations.tsv
            compose-results/**/project.json
            compose-results/**/browser/
          if-no-files-found: warn
          retention-days: 7
