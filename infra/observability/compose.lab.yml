# Standalone preparation stack. It does not connect to application databases.
# Always choose a unique project name; never use autostrada-local for this file.
services:
  tempo:
    image: grafana/tempo:3.0.3
    command: ['-target=all', '-config.file=/etc/tempo.yml']
    volumes:
      - ./tempo/tempo.yml:/etc/tempo.yml:ro
      - tempo-data:/var/tempo
    networks: [telemetry]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  loki:
    image: grafana/loki:3.7.8
    command: ['-config.file=/etc/loki.yml']
    volumes:
      - ./loki/loki.yml:/etc/loki.yml:ro
      - loki-data:/loki
    networks: [telemetry]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  alloy:
    image: grafana/alloy:v1.19.2
    command: ['run', '--storage.path=/tmp/alloy', '--server.http.listen-addr=127.0.0.1:12345', '/etc/alloy/config.alloy']
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - backend-logs:/logs/backend:ro
      - identity-logs:/logs/identity:ro
      - notification-logs:/logs/notification:ro
      - payment-logs:/logs/payment:ro
      - gateway-logs:/logs/gateway:ro
    networks: [telemetry]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  prometheus:
    image: prom/prometheus:v3.14.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=3d
      - --storage.tsdb.retention.size=512MB
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules.yml:/etc/prometheus/rules.yml:ro
      - prometheus-data:/prometheus
    networks: [telemetry]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  grafana:
    image: grafana/grafana:13.2.2
    environment:
      GF_SECURITY_ADMIN_USER: observer
      GF_SECURITY_ADMIN_PASSWORD: ${OBSERVABILITY_ADMIN_PASSWORD:?Set a private Grafana password}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: 'false'
      # Use the plugins bundled in the pinned image; runtime updates break read-only startup.
      GF_PLUGINS_PREINSTALL_AUTO_UPDATE: 'false'
      GF_PLUGINS_PLUGIN_ADMIN_ENABLED: 'false'
    ports:
      - '127.0.0.1:${OBSERVABILITY_GRAFANA_PORT:-3001}:3000'
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks: [telemetry, ui]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
networks:
  ui: {}
  telemetry:
    internal: true
volumes:
  tempo-data:
  loki-data:
  alloy-data:
  backend-logs:
  identity-logs:
  notification-logs:
  payment-logs:
  gateway-logs:
  prometheus-data:
  grafana-data:
