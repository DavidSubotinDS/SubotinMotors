global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules.yml

# These are private management listeners, not the public gateway routes.
# Enabling the application listeners is a separate integration gate.
scrape_configs:
  - job_name: autostrada
    metrics_path: /actuator/prometheus
    scrape_timeout: 5s
    sample_limit: 20000
    static_configs:
      - targets: ['gateway:9080']
        labels: {service: gateway}
      - targets: ['backend:9080']
        labels: {service: backend}
      - targets: ['identity:9080']
        labels: {service: identity}
      - targets: ['notification:9080']
        labels: {service: notification}
      - targets: ['payment:9080']
        labels: {service: payment}
